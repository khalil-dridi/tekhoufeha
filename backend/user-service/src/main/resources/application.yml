server:
  port: 8082


spring:
  application:
    name: user-service


  datasource:
    url: jdbc:mysql://localhost:3306/tekhoufeha_user_db
    username: root
    password: TekhouFeha@2026
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration



eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true



management:
  endpoints:
    web:
      exposure:
        include: health,info



app:
  default-avatar-url: https://tekhoufeha.com/default-avatar.png