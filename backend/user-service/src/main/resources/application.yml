server:
  port: 8082


spring:
  application:
    name: user-service


  datasource:
    url: jdbc:mysql://localhost:3306/tekhoufeha_user_db
    username: root
    password: TekhouFeha@2026
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration


  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB



eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true



management:
  endpoints:
    web:
      exposure:
        include: health,info



app:
  default-avatar-url: https://tekhoufeha.com/default-avatar.png



cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

jwt:
  secret: 4f6c8d0e5a1b9c7d3e2f8a6b1c9d4e7f5a8b2c6d9e1f3a7b4c8d0e5f1a9b3c7
  expiration: 86400000